[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ml-core"
version = "0.1.0"
description = "Core ML feature (datasets, training, prediction, visualization, EDA, annotation, experiment monitoring) for BAIGLE-style legal-ML apps — Flask blueprints, SQLAlchemy models, and the training/prediction/explanation compute engine, shared between the API process and the worker process."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "Flask>=2.3,<3",
    "Flask-SQLAlchemy>=3.0.5,<4",
    "SQLAlchemy>=2.0,<3",
    "Flask-JWT-Extended>=4.5,<5",
    "redis>=5.0,<6",
    "psycopg2-binary>=2.9.7,<3",  # legal_ml_core.worker builds its own engine against DATABASE_URL
    "pandas>=2.1,<3",
    "numpy>=1.24,<2",
    "scikit-learn>=1.4,<2",  # AgglomerativeClustering `metric=`/NMF `alpha_W=` kwargs require >=1.4
    "transformers[torch]>=4.35,<5",
    "accelerate>=0.24",
    "spacy>=3.7,<4",
    "nltk>=3.8,<4",
    "plotly>=5.17,<6",
    "lime>=0.2.0",
    "shap>=0.43",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
